worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"ts":"$time_iso8601","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    # Enabled automatically when the brotli module is present in the image.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    upstream api {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # API, OpenAPI docs and health checks proxy to FastAPI.
        location ~ ^/(api|docs|redoc|openapi.json|health) {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # Hashed build assets are immutable.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpg|jpeg|webp|avif|ico)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Generated by the API; keep it fresh.
        location = /sitemap.xml {
            proxy_pass http://api/api/content/sitemap.xml;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=3600";
        }

        location = /robots.txt {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA routing: every unknown path renders the app shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
